<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="campusDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090D16" />
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer Arc -->
    <path d="M -160 -40 A 180 180 0 0 1 160 -40" fill="none" stroke="url(#campusDropGrad)" stroke-width="28" stroke-linecap="round" opacity="0.4" />
    <!-- Middle Arc -->
    <path d="M -110 0 A 120 120 0 0 1 110 0" fill="none" stroke="url(#campusDropGrad)" stroke-width="28" stroke-linecap="round" opacity="0.75" />
    <!-- Inner Arc -->
    <path d="M -60 40 A 60 60 0 0 1 60 40" fill="none" stroke="url(#campusDropGrad)" stroke-width="28" stroke-linecap="round" />
    <!-- Center Node -->
    <circle cx="0" cy="110" r="28" fill="url(#campusDropGrad)" />
  </g>
</svg>
